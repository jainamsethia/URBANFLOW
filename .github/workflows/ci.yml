name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-11-arm' }}   # best effort on ARM runners
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run coverage run -m pytest
      - run: uv run coverage report --skip-empty
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"
      - run: uv sync --locked --group docs
      - run: uv run mkdocs build --strict

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t urbanflow .
      - name: Smoke test (UI, health, token)
        run: |
          docker run -d --name uf -p 127.0.0.1:8000:8000 urbanflow
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          docker logs uf
          curl -fs http://127.0.0.1:8000/ | grep -q "UrbanFlow"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/meta)" = 401
          token=$(docker logs uf 2>&1 | grep -o '#token=[A-Za-z0-9_-]*' | cut -d= -f2)
          curl -fs -b "urbanflow_token=$token" http://127.0.0.1:8000/api/v1/scenarios | grep -q grid_3x3
