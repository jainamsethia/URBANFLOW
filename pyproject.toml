[project]
name = "urbanflow"
version = "0.1.0"
description = "Python-first microscopic city traffic simulation and research workbench"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "UrbanFlow contributors" }]
keywords = ["traffic", "simulation", "microscopic", "reinforcement-learning", "transportation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=2.2,<3",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "networkx>=3.4,<4",
  "typer>=0.27,<1",
  "rich>=15",
  "sqlalchemy>=2.0.54,<2.1",
  "psutil>=7.2",
  "fastapi>=0.141,<1",
  "uvicorn>=0.53",
  "websockets>=17.1",
]

[project.optional-dependencies]
rl = ["gymnasium>=1.3,<2", "pettingzoo>=1.27,<2"]
rl-train = ["urbanflow[rl]", "stable-baselines3>=2.9,<3"]   # torch: x64 only on Windows
data = ["polars>=1.44", "pandas>=3.0"]
accel = ["numba>=0.67"]                                      # win_arm64: Python 3.14 only
postgres = [
  "psycopg[binary]>=3.3; platform_machine != 'ARM64'",       # psycopg-binary: no win_arm64 wheel, no sdist
  "psycopg>=3.3; platform_machine == 'ARM64'",                # pure Python; needs libpq.dll on PATH
]
all = ["urbanflow[rl,data,postgres]"]

[project.scripts]
urbanflow = "urbanflow.cli.main:main"

[project.urls]
Documentation = "https://github.com/urbanflow/urbanflow/tree/main/docs"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "pytest-timeout>=2.3",
  "pytest-benchmark>=5.3",
  "hypothesis>=6.168",
  "httpx>=0.28",
  "jsonschema>=4.23",
  "coverage>=7.13",
  "ruff>=0.16",
  "mypy>=2.3",
  "gymnasium>=1.3",
  "pettingzoo>=1.27",
  "polars>=1.44",
  "pandas>=3.0",
]
docs = ["mkdocs-material>=9.7"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/urbanflow/_frontend/"]   # gitignored build output; applies to sdist AND wheel (plan B.2 #4)

[tool.hatch.build.targets.wheel]
packages = ["src/urbanflow"]               # bundled scenarios are ordinary package data (plan B.2 #21)

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF", "PTH", "PERF", "S", "C4", "RET", "ARG"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S603", "S607", "S108", "ARG001"]
"scripts/**" = ["S603", "S607"]
"examples/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/urbanflow"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["networkx.*", "psutil.*", "gymnasium.*", "pettingzoo.*", "polars.*", "pandas.*", "numba.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not performance'"
markers = [
  "integration: real engine runs, servers, processes",
  "acceptance: acceptance tests AT-xx from the plan",
  "slow: long-running tests",
  "performance: benchmarks (deselected by default)",
]
timeout = 300
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["urbanflow"]
branch = true
